<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chipywarp Mod Manager</title>
    <!-- Include JSZip library from CDN to extract .cwm (zip) files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="icon" href="favicon.ico"></head>
<body>

    <h1>Mod Manager</h1>
    
    <div>
        <label for="mod-upload">Upload .cwm Mod File:</label>
        <!-- Accept .cwm files -->
        <input type="file" id="mod-upload" accept=".cwm" />
    </div>

    <hr />

    <h2>Installed Mods</h2>
    <div id="mod-list">
        <!-- Mod details will appear here -->
    </div>

    <script>
        // Listen for file selection
        document.getElementById('mod-upload').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const zip = new JSZip();
            
            try {
                // Load the .cwm file as a zip archive
                const loadedZip = await zip.loadAsync(file);

                // 1. Ensure content.json exists
                if (!loadedZip.file("content.json")) {
                    throw new Error("Invalid mod: content.json is missing.");
                }

                // 2. Read and parse content.json
                const jsonString = await loadedZip.file("content.json").async("string");
                const manifest = JSON.parse(jsonString);

                // 3. Extract the icon if it exists
                let iconDataUrl = "";
                if (manifest.icon && loadedZip.file(manifest.icon)) {
                    // Read the image as base64 and create a Data URL
                    const base64Data = await loadedZip.file(manifest.icon).async("base64");
                    iconDataUrl = "data:image/png;base64," + base64Data;
                }

                // 4. Extract and run the scripts
                if (manifest.script && Array.isArray(manifest.script)) {
                    for (const scriptName of manifest.script) {
                        if (loadedZip.file(scriptName)) {
                            const scriptContent = await loadedZip.file(scriptName).async("string");
                            runModScript(scriptContent);
                        } else {
                            console.warn(`Script file ${scriptName} not found in the archive.`);
                        }
                    }
                }

                // 5. Display the mod info on the page
                displayModInfo(manifest, iconDataUrl);

                // Clear the file input so you can upload the same file again if needed
                event.target.value = "";

            } catch (err) {
                console.error(err);
                alert("Failed to load mod: " + err.message);
            }
        });

        // Function to securely inject and execute the mod's JavaScript code
        function runModScript(jsCode) {
            // Create a Blob from the code and create a temporary URL for it
            const blob = new Blob([jsCode], { type: 'application/javascript' });
            const scriptUrl = URL.createObjectURL(blob);
            
            // Create a script tag and append it to the document
            const scriptElement = document.createElement('script');
            scriptElement.src = scriptUrl;
            document.body.appendChild(scriptElement);
        }

        // Function to render the mod data to the HTML page
        function displayModInfo(manifest, iconDataUrl) {
            const modList = document.getElementById('mod-list');
            const modContainer = document.createElement('div');
            
            let htmlContent = `<h3>${manifest.name} (v${manifest.version})</h3>`;
            htmlContent += `<p><strong>Author:</strong> ${manifest.author}</p>`;
            htmlContent += `<p><strong>Description:</strong> ${manifest.description}</p>`;
            
            // If the icon was successfully extracted, display it
            if (iconDataUrl) {
                htmlContent += `<img src="${iconDataUrl}" alt="${manifest.name} Icon" width="64" height="64" />`;
            }
            
            htmlContent += `<hr />`;
            
            modContainer.innerHTML = htmlContent;
            modList.appendChild(modContainer);
        }
    </script>
</body>
</html>
